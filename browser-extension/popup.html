<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
 body{width:330px;margin:0;font:13px/1.6 "Microsoft YaHei",system-ui,sans-serif;color:#e8e8ee;background:#1f2430}
 .h{padding:9px 12px;background:#2a3142;font-weight:600;display:flex;justify-content:space-between;align-items:center}
 .h a{font-size:11.5px;color:#9ecbff;cursor:pointer;font-weight:400}
 .b{padding:10px 12px}
 .st{margin-bottom:8px;padding:7px 9px;border-radius:7px;background:#171b24;font-size:12px}
 .ok{color:#9ee6b5}.bad{color:#ff9a9a}
 label{display:flex;gap:6px;align-items:center;font-size:12px;margin:8px 0}
 input{width:80px;background:#171b24;color:#eee;border:1px solid #3a4256;border-radius:6px;padding:3px 6px}
 button{background:#2e7d5b;color:#fff;border:0;border-radius:7px;padding:5px 9px;cursor:pointer;font-size:12px}
 .tip{opacity:.7;font-size:11.5px;margin-top:9px;border-top:1px solid #3a4256;padding-top:8px}
 .q{max-height:230px;overflow:auto}
 .qi{padding:5px 0;border-bottom:1px dashed #2c3241}
 .qr{display:flex;justify-content:space-between;gap:6px;font-size:11.5px}
 .qn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .qd{font-size:10.5px;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .qb{height:4px;background:#171b24;border-radius:3px;overflow:hidden;margin:3px 0}
 .qb i{display:block;height:100%;background:#2e7d5b}
 .qi.ok .qd{color:#9ee6b5}.qi.err .qd{color:#ff9a9a}.qi.err .qb i{background:#b1484d}
 .x{cursor:pointer;opacity:.55;padding:0 3px}.x:hover{opacity:1}
 .empty{opacity:.5;font-size:11.5px}
</style></head>
<body>
<div class="h"><span>FFXIV Mod 管理器助手</span><a id="clear">清空已完成</a></div>
<div class="b">
  <div class="st" id="st">检查中…</div>
  <div id="queue" class="q"><div class="empty">（队列空）</div></div>
  <label>管理器端口 <input id="port" placeholder="自动"> <button id="set">连接</button></label>
  <div class="tip">用法：在 XIVModArchive 的 Mod 页面右下角小面板里选好分类/子分类/标签 → 点「加入队列」。
  多个 Mod 会排队依次处理（管理器一次只跑一个任务）；这里可以随时看进度、移除或重试。</div>
</div>
<script src="popup.js"></script>
</body></html>
